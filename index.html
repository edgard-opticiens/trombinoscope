<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trombinoscope - Edgard</title>
<style>
  :root {
    --brand: #4a1621;
    --brand-light: #6b2432;
    --bg: #f4f2ef;
    --card-bg: #ffffff;
    --border: #e2ddd7;
    --text: #2c2c2a;
    --text-secondary: #6a6a66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--brand);
    color: #fff;
    padding: 18px 32px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  .select-row {
    margin-bottom: 32px;
  }
  .select-row label {
    display: block;
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  select {
    width: 100%;
    max-width: 420px;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
  }
  #status {
    font-size: 14px;
    color: var(--text-secondary);
    padding: 24px 0;
    text-align: center;
  }
  #status.error { color: #a32d2d; }
  .level {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 28px;
    padding: 10px 0;
  }
  .connector {
    width: 1px;
    height: 24px;
    background: var(--border);
    margin: 0 auto;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 150px;
    text-align: center;
  }
  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--border);
    background: var(--card-bg);
  }
  .avatar.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--brand-light);
    color: #fff;
    font-weight: 600;
    font-size: 24px;
  }
  .name {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }
  #gate {
    max-width: 380px;
    margin: 48px auto 0;
    padding: 28px 26px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-align: center;
  }
  #gate h1 {
    font-size: 17px;
    margin: 0 0 6px;
  }
  #gate p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin: 0 0 20px;
  }
  #gate select,
  #gate input {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    margin-bottom: 10px;
    font-family: inherit;
  }
  #gate button {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
    margin-top: 4px;
  }
  #gate button:hover { background: var(--brand-light); }
  #gate button:disabled { opacity: .6; cursor: default; }
  #gate .gate-err {
    min-height: 18px;
    font-size: 13px;
    color: #a32d2d;
    margin-top: 10px;
  }
  #gate .gate-note {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 16px;
    line-height: 1.4;
  }
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  #logout-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-secondary);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  #logout-btn:hover { background: var(--bg); }
</style>
</head>
<body>

<header>EDGARD &middot; Trombinoscope</header>

<main>
  <div id="gate" hidden>
    <h1>Connexion</h1>
    <p id="gate-sub">Sélectionnez votre magasin et saisissez votre code</p>
    <select id="gate-store"></select>
    <input id="gate-pin" type="password" maxlength="40" placeholder="Code d'accès" autocomplete="off">
    <button id="gate-btn" type="button">Accéder</button>
    <div class="gate-err" id="gate-err"></div>
    <div class="gate-note">Accès réservé aux équipes du groupe. Le code est vérifié par le serveur ; une fois connecté(e), vous pouvez consulter le trombinoscope de tous les magasins.</div>
  </div>

  <div id="appContent" hidden>
    <div class="app-header">
      <div></div>
      <button type="button" id="logout-btn">Se déconnecter</button>
    </div>
    <div class="select-row">
      <label for="store-select">Selectionnez le nom d'un magasin dans la liste deroulante pour afficher le trombinoscope</label>
      <select id="store-select">
        <option value="">-- Choisir un magasin --</option>
        <option value="ANGO">ANGO</option>
        <option value="BIARRO">BIARRO</option>
        <option value="BORDO">BORDO</option>
        <option value="CAENPO">CAENPO</option>
        <option value="CHATO">CHATO</option>
        <option value="CHEMILLO">CHEMILLO</option>
        <option value="CHOLO">CHOLO</option>
        <option value="DUNES">DUNES</option>
        <option value="ECUME">ECUME</option>
        <option value="FORMIO">FORMIO</option>
        <option value="GIRO">GIRO</option>
        <option value="HAVRO">HAVRO</option>
        <option value="JISAM">JISAM</option>
        <option value="LYONO">LYONO</option>
        <option value="MANSO">MANSO</option>
        <option value="MARAIS">MARAIS</option>
        <option value="MARSEILLO">MARSEILLO</option>
        <option value="MUDO">MUDO</option>
        <option value="NANCEO">NANCEO</option>
        <option value="NANTO">NANTO</option>
        <option value="NICEO">NICEO</option>
        <option value="NIORTO">NIORTO</option>
        <option value="ORLO">ORLO</option>
        <option value="REIMO">REIMO</option>
        <option value="STRABO">STRABO</option>
        <option value="TURO">TURO</option>
        <option value="EDGARD DEVELOPPEMENT">EDGARD DEVELOPPEMENT (Siege)</option>
      </select>
    </div>

    <div id="status"></div>
    <div id="tree"></div>
  </div>
</main>

<script>
  /* ===== Connexion sécurisée =====
     Login direct sur cette page (code magasin/directeur ou code RH), comme sur les autres
     outils du groupe. Le jeton obtenu est enregistré sous la meme cle que les autres outils
     (edgard_auth_v2) : une connexion faite ici sert aussi ailleurs, et inversement. */
  const SECURE_READ_URL = "https://edgard-opticiens.app.n8n.cloud/webhook/secure-read";
  const N8N_AUTH_LOGIN = "https://edgard-opticiens.app.n8n.cloud/webhook/auth-login";
  const AUTH_KEY = "edgard_auth_v2";

  function authGet() {
    try {
      const o = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
      if (!o || !o.token) return null;
      if (Number(o.expire) <= Date.now()) return null;
      return o;
    } catch (e) { return null; }
  }
  function authSave(o) { try { localStorage.setItem(AUTH_KEY, JSON.stringify(o)); } catch (e) {} }
  function authClear() { try { localStorage.removeItem(AUTH_KEY); } catch (e) {} }
  function authPost(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "reponse" }; }).then(function (j) {
        j.httpStatus = r.status;
        return j;
      });
    });
  }
  function authLogin(role, magasin, code) {
    return authPost(N8N_AUTH_LOGIN, { role: role, magasin: magasin, code: code });
  }

  const DIR_STORES = ["ANGO","BIARRO","BORDO","CAENPO","CHATO","CHEMILLO","CHOLO","DUNES","ECUME","EDGARD_DEV_NANTES","EDGARD_DEV_TOURS","FORMIO","GIRO","HAVRO","JISAM","LYONO","MANSO","MARAIS","MARSEILLO","MUDO","NANCEO","NANTO","NICEO","NIORTO","ORLO","REIMO","STRABO","TURO"];
  const RH_VALUE = "__RH__";

  const gateEl = document.getElementById("gate");
  const appEl = document.getElementById("appContent");
  const selectEl = document.getElementById("store-select");
  const statusEl = document.getElementById("status");
  const treeEl = document.getElementById("tree");
  const gateStoreEl = document.getElementById("gate-store");
  const gatePinEl = document.getElementById("gate-pin");
  const gateBtnEl = document.getElementById("gate-btn");
  const gateErrEl = document.getElementById("gate-err");
  const logoutBtnEl = document.getElementById("logout-btn");

  function gateError(t) { gateErrEl.textContent = t || ""; }

  function fillGateStores() {
    gateStoreEl.innerHTML = "";
    const first = document.createElement("option");
    first.value = ""; first.textContent = "— Choisir un magasin —";
    gateStoreEl.appendChild(first);
    DIR_STORES.forEach(function (n) {
      const o = document.createElement("option");
      o.value = n; o.textContent = n.replace(/_/g, " ");
      gateStoreEl.appendChild(o);
    });
    const rh = document.createElement("option");
    rh.value = RH_VALUE; rh.textContent = "Ressources humaines (RH)";
    gateStoreEl.appendChild(rh);
  }

  function showGate() {
    gateEl.hidden = false;
    appEl.hidden = true;
    gateError("");
  }
  function showApp() {
    gateEl.hidden = true;
    appEl.hidden = false;
  }

  function handleGateResult(j) {
    if (j && j.ok) {
      authSave({ token: j.token, role: j.role, magasin: j.magasin, expire: j.expire });
      gatePinEl.value = "";
      showApp();
    } else if (j && j.error === "verrouille") {
      gateError("Trop d'essais. Réessayez dans " + (j.minutes || 15) + " min.");
      gatePinEl.value = "";
    } else {
      gateError("Code incorrect.");
      gatePinEl.value = "";
    }
  }

  async function submitGate() {
    const choix = gateStoreEl.value;
    const code = gatePinEl.value.trim();
    if (!choix) { gateError("Choisissez votre magasin."); return; }
    if (!code) { gateError("Saisissez votre code."); return; }
    gateBtnEl.disabled = true;
    gateError("Vérification…");
    try {
      const isRH = choix === RH_VALUE;
      if (isRH) {
        handleGateResult(await authLogin("RH", "RH", code));
      } else {
        // Le code "collaborateur" (celui du portail / Soldes CP) est essaye en premier.
        // S'il echoue sans etre verrouille (mauvais code, ou magasin - comme Edgard Dev -
        // qui n'a pas ce code), on retente avec le code "variables de paie", seul code que
        // possedent certaines entites (Edgard Dev / Edgard Dev Com / Edgard Dev Nantes).
        let j = await authLogin("COLLAB", choix, code);
        if (!(j && j.ok) && !(j && j.error === "verrouille")) {
          j = await authLogin("DIR", choix, code);
        }
        if (!(j && j.ok) && !(j && j.error === "verrouille")) {
          j = await authLogin("VAR", choix, code);
        }
        handleGateResult(j);
      }
    } catch (e) {
      gateError("Connexion au serveur impossible. Réessayez dans un instant.");
    }
    gateBtnEl.disabled = false;
  }

  fillGateStores();
  gateBtnEl.addEventListener("click", submitGate);
  gatePinEl.addEventListener("keydown", function (e) { if (e.key === "Enter") submitGate(); });
  logoutBtnEl.addEventListener("click", function () {
    authClear();
    selectEl.value = "";
    treeEl.innerHTML = "";
    statusEl.textContent = "";
    showGate();
  });

  if (authGet()) { showApp(); } else { showGate(); }

  function initials(nom, prenom) {
    return ((prenom || "")[0] || "") .toUpperCase() + ((nom || "")[0] || "").toUpperCase();
  }

  function renderCard(p) {
    const card = document.createElement("div");
    card.className = "card";

    let img;
    if (p.photoBase64) {
      img = document.createElement("img");
      img.className = "avatar";
      img.src = "data:image/jpeg;base64," + p.photoBase64;
      img.alt = (p.prenom || "") + " " + (p.nom || "");
    } else {
      img = document.createElement("div");
      img.className = "avatar placeholder";
      img.textContent = initials(p.nom, p.prenom);
    }
    card.appendChild(img);

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = (p.prenom || "") + " " + (p.nom || "");
    card.appendChild(name);

    return card;
  }

  function buildLevels(employees) {
    const byManager = {};
    employees.forEach(function (p) {
      const key = p.managerId === null || p.managerId === undefined ? "root" : p.managerId;
      if (!byManager[key]) byManager[key] = [];
      byManager[key].push(p);
    });
    Object.keys(byManager).forEach(function (k) {
      byManager[k].sort(function (a, b) { return (a.ordre || 0) - (b.ordre || 0); });
    });

    const levels = [];
    let current = byManager["root"] || [];
    while (current.length) {
      levels.push(current);
      let next = [];
      current.forEach(function (p) {
        if (byManager[p.id]) next = next.concat(byManager[p.id]);
      });
      current = next;
    }
    return levels;
  }

  function renderTree(data) {
    treeEl.innerHTML = "";
    const levels = buildLevels(data.employees || []);

    if (!levels.length) {
      statusEl.textContent = "Aucun collaborateur trouve pour ce magasin.";
      return;
    }

    levels.forEach(function (level, i) {
      const levelEl = document.createElement("div");
      levelEl.className = "level";
      level.forEach(function (p) { levelEl.appendChild(renderCard(p)); });
      treeEl.appendChild(levelEl);

      if (i < levels.length - 1) {
        const connector = document.createElement("div");
        connector.className = "connector";
        treeEl.appendChild(connector);
      }
    });
  }

  async function loadStore(magasin) {
    treeEl.innerHTML = "";
    statusEl.className = "";
    if (!magasin) {
      statusEl.textContent = "";
      return;
    }
    const auth = authGet();
    if (!auth) {
      gateEl.hidden = false;
      appEl.hidden = true;
      return;
    }
    statusEl.textContent = "Chargement...";

    try {
      const res = await fetch(SECURE_READ_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: auth.token, source: "trombinoscope", params: { magasin: magasin } })
      });
      const j = await res.json().catch(function () { return null; });
      if (!res.ok || !j || !j.ok) {
        if (j && j.error === "session") {
          gateEl.hidden = false;
          appEl.hidden = true;
          return;
        }
        throw new Error("reponse " + res.status);
      }
      statusEl.textContent = "";
      renderTree(j.resultat || {});
    } catch (err) {
      statusEl.className = "error";
      statusEl.textContent = "Impossible de charger le trombinoscope pour ce magasin. Reessayez plus tard.";
    }
  }

  selectEl.addEventListener("change", function (e) { loadStore(e.target.value); });
</script>

</body>
</html>
